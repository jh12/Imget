name: release
on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: imget

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.9.15
      with:
        versionSpec: '5.x'
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0.9.15
    # QEMU
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3
    # Buildx
    - name: Setup Docker BuildX
      id: buildx
      uses: docker/setup-buildx-action@v3
    # Docker login
    - name: Login to Github Container Registry
      uses: docker/login-action@v3
      with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    # Login, build & publish docker image
    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v4
      with:
        file: Dockerfile
        builder: ${{ steps.buildx.outputs.name }}
        platforms: linux/amd64,linux/arm64
        context: .
        push: true
        provenance: false
        tags: |
          ${{ env.REGISTRY }}/jh12/${{ env.IMAGE_NAME }}:${{ steps.gitversion.outputs.NuGetVersionV2 }}
          ${{ env.REGISTRY }}/jh12/${{ env.IMAGE_NAME }}:${{ steps.gitversion.outputs.Major }}${{ steps.gitversion.outputs.PreReleaseLabelWithDash }}
          ${{ env.REGISTRY }}/jh12/${{ env.IMAGE_NAME }}:${{ steps.gitversion.outputs.Major }}.${{ steps.gitversion.outputs.Minor }}${{ steps.gitversion.outputs.PreReleaseLabelWithDash }}
        build-args: RELEASE_VERSION=${{ steps.gitversion.outputs.NuGetVersionV2 }}